<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Sign Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Minecraft Sign Generator</h1>
        <input type="text" id="textInput" placeholder="Sign text..." value="Welcome!">
        <label>Color: <input type="color" id="colorPicker" value="#ffffff"></label>
        <div id="sign" class="sign">Welcome!</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
